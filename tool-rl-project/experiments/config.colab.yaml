# Colab configuration for production experiments on A100
# Copy this to config.yaml when running on Colab, or load it directly with:
#   python src/train_sft.py --config experiments/config.colab.yaml

run_name: colab_mistral
seed: 42

# Model configuration
model:
  # Mistral-7B Instruct v0.3 on A100 (gated: accept the license on HF and set HF_TOKEN)
  model_id: "mistralai/Mistral-7B-Instruct-v0.3"
  trust_remote_code: false
  tokenizer_id: "mistralai/Mistral-7B-Instruct-v0.3"

# Legacy fields (for backward compatibility)
model_name: "mistralai/Mistral-7B-Instruct-v0.3"
tokenizer_name: "mistralai/Mistral-7B-Instruct-v0.3"

train:
  sft_epochs: 3
  rl_steps: 2000
  per_device_batch_size: 4  # A100 can handle larger batches with long sequences
  gradient_accumulation_steps: 4  # Effective batch size = 4 * 4 = 16
  gradient_checkpointing: true
  learning_rate: 5.0e-5
  warmup_steps: 200
  max_length: 3200  # Mistral-7B can handle longer contexts
  fp16: false
  bf16: true  # A100 supports bf16 - better than fp16 for training

rl:
  # init_model defaults to experiments/runs/<run_name>/final (the SFT output)
  learning_rate: 1.0e-5
  per_device_batch_size: 4
  gradient_accumulation_steps: 2
  num_generations: 4  # completions sampled per prompt (GRPO group size)
  max_completion_length: 128
  temperature: 1.0
  beta: 0.04  # KL penalty against the reference (base weights under LoRA)
  lora_r: 16
  lora_alpha: 32

reward:
  tool_selection: 1.0
  schema_validity: 1.0
  argument_accuracy: 1.0
  no_call_penalty: -0.2

data:
  processed_path: "data/processed/train.jsonl"
  eval_path: "data/processed/val.jsonl"

logging:
  output_dir: "experiments/runs"
  log_interval: 10
