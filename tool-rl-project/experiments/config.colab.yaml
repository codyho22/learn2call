# Colab configuration for production experiments on A100
# Copy this to config.yaml when running on Colab, or load it directly with:
#   python src/train_sft.py --config experiments/config.colab.yaml

run_name: colab_mistral
seed: 42

# Model configuration
model:
  # Mistral-7B for production experiments on A100
  model_id: "mistralai/Mistral-7B"
  trust_remote_code: false
  tokenizer_id: "mistralai/Mistral-7B"

# Legacy fields (for backward compatibility)
model_name: "mistralai/Mistral-7B"
tokenizer_name: "mistralai/Mistral-7B"

train:
  sft_epochs: 3
  rl_steps: 2000
  per_device_batch_size: 4  # A100 can handle larger batches with long sequences
  gradient_accumulation_steps: 4  # Effective batch size = 4 * 4 = 16
  gradient_checkpointing: true
  learning_rate: 5.0e-5
  warmup_steps: 200
  max_length: 3200  # Mistral-7B can handle longer contexts
  fp16: false
  bf16: true  # A100 supports bf16 - better than fp16 for training

data:
  processed_path: "data/processed/train.jsonl"
  eval_path: "data/processed/val.jsonl"

logging:
  output_dir: "experiments/runs"
  log_interval: 10
