# Experiment configuration for local development
# Change model.model_id to "mistralai/Mistral-7B-Instruct-v0.3" when running on Colab with A100

run_name: debug
seed: 42

# Model configuration
model:
  # Model ID from Hugging Face Hub
  # Local: "microsoft/phi-2" (small, fits on my GPU)
  # Colab: "mistralai/Mistral-7B-Instruct-v0.3" (gated model on A100)
  model_id: "microsoft/phi-2"
  trust_remote_code: true
  
  # Tokenizer ID 
  tokenizer_id: "microsoft/phi-2"

model_name: "microsoft/phi-2" #Legacy fields
tokenizer_name: "microsoft/phi-2"

train:
  sft_epochs: 1
  rl_steps: 500
  per_device_batch_size: 1  # Reduced for longer sequences
  gradient_accumulation_steps: 8  #Effective batch size = 1 * 8 = 8
  gradient_checkpointing: true
  learning_rate: 5.0e-5
  warmup_steps: 100
  max_length: 2048  # Phi-2 max context length
  fp16: true  # Enable mixed precision for memory efficiency
  bf16: false  # Use bf16 instead of fp16 if supported

rl:
  # init_model defaults to experiments/runs/<run_name>/final (the SFT output)
  learning_rate: 1.0e-5
  per_device_batch_size: 4
  gradient_accumulation_steps: 2
  num_generations: 4  # completions sampled per prompt (GRPO group size)
  max_completion_length: 128
  temperature: 1.0
  beta: 0.04  # KL penalty against the reference (base weights under LoRA)
  lora_r: 16
  lora_alpha: 32

reward:
  tool_selection: 1.0
  schema_validity: 1.0
  argument_accuracy: 1.0
  no_call_penalty: -0.2

data:
  processed_path: "data/processed/train.jsonl"
  eval_path: "data/processed/val.jsonl"

logging:
  output_dir: "experiments/runs"
  log_interval: 10
